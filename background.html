<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #2a1a26;
        }
        .ambient-bg {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse 60% 50% at 18% 25%, rgba(180, 110, 150, 0.55) 0%, rgba(180, 110, 150, 0) 65%),
                radial-gradient(ellipse 55% 45% at 82% 18%, rgba(120, 100, 180, 0.5) 0%, rgba(120, 100, 180, 0) 65%),
                radial-gradient(ellipse 60% 55% at 75% 85%, rgba(180, 120, 110, 0.45) 0%, rgba(180, 120, 110, 0) 65%),
                radial-gradient(ellipse 55% 50% at 22% 88%, rgba(90, 140, 170, 0.4) 0%, rgba(90, 140, 170, 0) 65%),
                linear-gradient(160deg, #3a2030 0%, #2a1a26 45%, #221830 100%);
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 2;
            will-change: transform;
        }
        .blob.b1 {
            width: 620px; height: 620px;
            background: radial-gradient(circle, rgba(255, 140, 190, 0.75) 0%, rgba(255, 140, 190, 0) 70%);
            top: -12%; left: -10%;
            animation: drift1 26s infinite alternate ease-in-out;
        }
        .blob.b2 {
            width: 720px; height: 720px;
            background: radial-gradient(circle, rgba(160, 130, 255, 0.65) 0%, rgba(160, 130, 255, 0) 70%);
            top: -20%; right: -18%;
            animation: drift2 32s infinite alternate ease-in-out;
        }
        .blob.b3 {
            width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(255, 160, 130, 0.6) 0%, rgba(255, 160, 130, 0) 70%);
            bottom: -18%; left: 15%;
            animation: drift3 29s infinite alternate ease-in-out;
        }
        .blob.b4 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(120, 210, 200, 0.55) 0%, rgba(120, 210, 200, 0) 70%);
            bottom: -15%; right: 8%;
            animation: drift4 35s infinite alternate ease-in-out;
        }
        @keyframes drift1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(90px, 60px) scale(1.12); }
        }
        @keyframes drift2 {
            0%   { transform: translate(0, 0) scale(1.05); }
            100% { transform: translate(-80px, 70px) scale(0.95); }
        }
        @keyframes drift3 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(70px, -60px) scale(1.15); }
        }
        @keyframes drift4 {
            0%   { transform: translate(0, 0) scale(1.05); }
            100% { transform: translate(-60px, -50px) scale(0.9); }
        }
        .ambient-haze {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            mix-blend-mode: soft-light;
        }
        .canvas-container {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: transparent;
            filter: blur(5px) contrast(1.6) saturate(1.2);
            mix-blend-mode: screen;
            opacity: 0.9;
            pointer-events: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="ambient-haze"></div>

    <div class="canvas-container">
        <canvas id="slimeCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('slimeCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let colliders = [];
        let fpsCap = 0;

        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d) return;
            if (d.type === 'colliders') {
                colliders = d.rects || [];
            } else if (d.type === 'fps-cap') {
                fpsCap = d.value || 0;
            }
        });

        let slimes = [];
        let particles = [];
        const MAX_LIFE = 12000;
        const STUCK_TIME = 2500;
        const BOTTOM_ZONE = 260;

        class SlimeBlob {
            constructor(initY = false) {
                this.reset(initY);
            }
            reset(initY = false) {
                this.radius = Math.random() * 25 + 25;
                this.x = Math.random() * (window.innerWidth - this.radius * 2) + this.radius;
                this.y = initY
                    ? Math.random() * window.innerHeight
                    : window.innerHeight + this.radius + Math.random() * 120;
                this.vy = -(Math.random() * 1.2 + 0.8);
                this.vx = (Math.random() - 0.5) * 0.4;
                this.wobbleSpeed = Math.random() * 0.03 + 0.015;
                this.wobbleCount = Math.random() * 100;
                this.baseRise = this.vy;
                this.bornAt = performance.now();
                this.lastProgressY = this.y;
                this.lastProgressAt = performance.now();
                this.squeeze = 0;
            }
            pop() {
                const count = Math.floor(this.radius * 0.8);
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    particles.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(a) * speed,
                        vy: Math.sin(a) * speed - 1,
                        radius: Math.random() * 8 + 4,
                        alpha: 1
                    });
                }
                this.reset();
            }
            update(now) {
                this.wobbleCount += this.wobbleSpeed;

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.99;
                this.vy *= 0.998;
                this.vx += Math.sin(this.wobbleCount) * 0.02;

                if (this.squeeze < 0.4) {
                    this.vy += (this.baseRise - this.vy) * 0.01;
                }
                this.squeeze *= 0.94;

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = Math.abs(this.vx) * 0.6 + 0.1;
                } else if (this.x + this.radius > window.innerWidth) {
                    this.x = window.innerWidth - this.radius;
                    this.vx = -Math.abs(this.vx) * 0.6 - 0.1;
                }

                for (let i = 0; i < colliders.length; i++) {
                    const r = colliders[i];
                    const closestX = Math.max(r.x, Math.min(this.x, r.x + r.w));
                    const closestY = Math.max(r.y, Math.min(this.y, r.y + r.h));
                    const dx = this.x - closestX;
                    const dy = this.y - closestY;
                    const d2 = dx * dx + dy * dy;

                    if (d2 < this.radius * this.radius) {
                        let nx, ny, dist;

                        if (d2 > 0.0001) {
                            dist = Math.sqrt(d2);
                            nx = dx / dist;
                            ny = dy / dist;
                        } else {
                            const left = this.x - r.x;
                            const right = r.x + r.w - this.x;
                            const top = this.y - r.y;
                            const bottom = r.y + r.h - this.y;
                            const min = Math.min(left, right, top, bottom);
                            if (min === left)       { nx = -1; ny = 0; dist = 0; }
                            else if (min === right) { nx = 1;  ny = 0; dist = 0; }
                            else if (min === top)   { nx = 0;  ny = -1; dist = 0; }
                            else                    { nx = 0;  ny = 1;  dist = 0; }
                        }

                        const overlap = this.radius - dist;
                        this.x += nx * overlap;
                        this.y += ny * overlap;

                        const dot = this.vx * nx + this.vy * ny;
                        this.vx -= 2 * dot * nx;
                        this.vy -= 2 * dot * ny;

                        this.vx *= 0.75;
                        this.vy *= 0.75;
                        this.vx += (Math.random() - 0.5) * 0.6;

                        if (this.vy > -0.4) {
                            this.vy = -0.8 - Math.random() * 0.6;
                        }
                        this.vx = Math.max(-2.5, Math.min(2.5, this.vx));

                        this.squeeze = Math.min(1, this.squeeze + 0.25);
                    }
                }

                if (this.y < this.lastProgressY - 0.5) {
                    this.lastProgressY = this.y;
                    this.lastProgressAt = now;
                }

                const stuckFor = now - this.lastProgressAt;
                const age = now - this.bornAt;

                const inBottomZone = this.y > window.innerHeight - BOTTOM_ZONE;
                const stuckLimit = inBottomZone ? STUCK_TIME * 0.5 : STUCK_TIME;

                const pushedIntoCorner =
                    this.squeeze > 0.6 && Math.abs(this.vy) < 0.35;

                if (stuckFor > stuckLimit || age > MAX_LIFE || (pushedIntoCorner && stuckFor > 800)) {
                    this.pop();
                    return;
                }

                if (this.y + this.radius < -50) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 22; i++) slimes.push(new SlimeBlob(true));

        function animate() {
            const now = performance.now();
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            for (let i = 0; i < slimes.length; i++) {
                slimes[i].update(now);
                slimes[i].draw();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.93;
                p.vy *= 0.93;
                p.vy += 0.05;
                p.alpha -= 0.02;
                p.radius *= 0.98;

                if (p.alpha <= 0 || p.radius < 0.5) {
                    particles.splice(i, 1);
                } else {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
